apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: retail-ai-location-strategy
  description: Google ADK agent 'retail-ai-location-strategy' served on port 8080 (adk web). Deployable
    to GCP Cloud Run via the shared story-teller-gcp-us-central target.
  tags:
    env: dev
  labels:
    app: retail-ai-location-strategy
    framework: google-adk
  annotations:
    sherpa.7sg.ai/origin: adk-samples
  version: 0.1.4
workload:
  source:
    git:
      repoUrl: https://github.com/7sg-ai/adk-samples2
      ref: slos-in-scenario
      path: python/agents/retail-ai-location-strategy
security:
  policies:
    secretsInEnvAllowed: true
secrets:
  provider: external-secrets
  vaults:
  - name: gcp-main
    projectIdRef: gcp-secret-manager-project-id
    tokenRef: gcp-sa-key-json
  secretRefs:
  - name: google-cloud-project
    injectAs: env
    envVar: GOOGLE_CLOUD_PROJECT
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: google-cloud-project
  - name: google-cloud-location
    injectAs: env
    envVar: GOOGLE_CLOUD_LOCATION
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: google-cloud-location
  - name: google-api-key
    injectAs: env
    envVar: GOOGLE_API_KEY
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: google-api-key
  - name: deploy-service-account-key
    injectAs: file
    filePath: /credentials/deploy-sa.json
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: deploy-service-account-key
  - name: deploy-service-account-key-json
    injectAs: env
    envVar: GCP_SA_KEY_JSON
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: deploy-service-account-key
  - name: google-maps-key
    injectAs: env
    envVar: MAPS_API_KEY
    externalRef:
      provider: gcp-secret-manager
      vaultRef: gcp-main
      key: google-maps-key
dataSources:
  inputs: []
  outputs: []
scenarios:
  native:
    description: Google ADK agent 'retail-ai-location-strategy' served on port 8080 (adk web). Deployable
      to GCP Cloud Run via the shared story-teller-gcp-us-central target.
    topology:
      components:
      - name: retail-ai-location-strategy-service
        role: api
        runtime:
          platform: serverless
          regions:
          - us-central1
          image:
            repository: retail-ai-location-strategy
            tag: latest
          env:
          - name: GOOGLE_GENAI_USE_VERTEXAI
            value: 'true'
          envFromSecretRefs:
          - google-maps-key
          - google-cloud-project
          - google-cloud-location
          resources:
            cpu: '1'
            memory: 2Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 5
            policy:
              metric: cpu
              target: 70
        endpoints:
        - name: http
          port: 8080
          exposure: public
          protocol: http
          path: /

    slos:
      latency:
        p50_ms: 30000
        p95_ms: 65000
        p99_ms: 100000
      ttft:
        p95_ms: null
      reliability:
        success_rate_min_pct: 80.0
        error_rate_max_pct: 20.0
        retry_rate_max_pct: 10.0
      cost:
        max_cost_per_transaction_usd: 0.10
      cache:
        hit_rate_min_pct: 0.0
      load:
        replay_concurrency: 3   # heavy geospatial pipeline; limited concurrency

    models:
      - model: gemini-2.5-flash      # optional identity
        minReplicaCount: 1           # optional, integer >= 0
        maxReplicaCount: 5           # optional, integer >= 1
      - model: gemini-2.5-pro
        minReplicaCount: 0
        maxReplicaCount: 2
    deployments:
    - name: retail-ai-location-strategy-gcp-us-central
      target:
        provider: gcp
        region: us-central1
        tdfRef: story-teller-gcp-us-central
      components:
      - retail-ai-location-strategy-service
  alternates:
  - name: local-dev
    description: Local development using a Gemini API key (no Vertex AI).
    topology:
      components:
      - name: retail-ai-location-strategy-service
        role: api
        runtime:
          platform: custom
          regions:
          - local
          image:
            repository: retail-ai-location-strategy
            tag: dev
          env:
          - name: GOOGLE_GENAI_USE_VERTEXAI
            value: 'false'
          envFromSecretRefs:
          - google-api-key
          resources:
            cpu: '1'
            memory: 1Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 1
        endpoints:
        - name: http
          port: 8080
          exposure: public
          protocol: http
          path: /

    slos:
      latency:
        p50_ms: 30000
        p95_ms: 65000
        p99_ms: 100000
      ttft:
        p95_ms: null
      reliability:
        success_rate_min_pct: 80.0
        error_rate_max_pct: 20.0
        retry_rate_max_pct: 10.0
      cost:
        max_cost_per_transaction_usd: 0.10
      cache:
        hit_rate_min_pct: 0.0
      load:
        replay_concurrency: 3   # heavy geospatial pipeline; limited concurrency

    models:
      - model: gemini-2.5-flash      # optional identity
        minReplicaCount: 1           # optional, integer >= 0
        maxReplicaCount: 5           # optional, integer >= 1
      - model: gemini-2.5-pro
        minReplicaCount: 0
        maxReplicaCount: 2
    deployments:
    - name: local
      target:
        provider: onprem
        region: local
      components:
      - retail-ai-location-strategy-service

