apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: yugabyte-graph-ntt
  version: "1.0.0"
  tags:
    env: prod
    role: graph
    target: private
home:
  tdfRef: ntt-private
connection:
  type: database
  provider: yugabyte
  resource: workbook_graph
  capabilities:
    graphEngine: apache-age
    supportsPropertyGraph: true
    excelLoader: true
    arch: arm64
auth:
  method: password
  secretRefs:
    - yugabyte-ntt-user
    - yugabyte-ntt-password
secrets:
  provider: external
  inheritFromWdf: false
  secretRefs:
    - name: yugabyte-ntt-user
      injectAs: env
      envVar: YUGABYTE_USER
      externalRef:
        provider: ntt-vault
        key: yugabyte-ntt-user
    - name: yugabyte-ntt-password
      injectAs: env
      envVar: YUGABYTE_PASSWORD
      externalRef:
        provider: ntt-vault
        key: yugabyte-ntt-password
notes:
  - >
    Same graph engine as yugabyte-graph-gcp, deployed on the NTT GB10
    cluster (ARM). Runtime access from the Google-hosted application
    interface to this endpoint is TBD until NTT confirms how it is exposed.
