apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: llm-auditor
  description: >
    Multi-agent LLM fact-checking service built with Google ADK. A sequential
    pipeline of critic and reviser agents evaluates LLM-generated answers,
    verifies factual accuracy using web search, and rewrites responses to
    correct inaccuracies. Exposes an ADK web UI on port 8080.
  tags:
    env: dev
  labels:
    app: llm-auditor
    framework: google-adk
  annotations:
    sherpa.7sg.ai/origin: adk-samples
  version: "0.1.3"

workload:
  source:
    git:
      repoUrl: https://github.com/7sg-ai/adk-samples2
      ref: slos-in-scenario
      path: python/agents/llm-auditor

security:
  policies:
    secretsInEnvAllowed: true

secrets:
  provider: external-secrets
  vaults:
    - name: gcp-main
      projectIdRef: gcp-secret-manager-project-id
      tokenRef: gcp-sa-key-json
  secretRefs:
    - name: google-cloud-project
      injectAs: env
      envVar: GOOGLE_CLOUD_PROJECT
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-cloud-project
    - name: google-cloud-location
      injectAs: env
      envVar: GOOGLE_CLOUD_LOCATION
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-cloud-location
    - name: google-api-key
      injectAs: env
      envVar: GOOGLE_API_KEY
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-api-key
    - name: deploy-service-account-key
      injectAs: file
      filePath: /credentials/deploy-sa.json
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: deploy-service-account-key
    - name: deploy-service-account-key-json
      injectAs: env
      envVar: GCP_SA_KEY_JSON
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: deploy-service-account-key

dataSources:
  inputs:
    - name: google-search
      description: Built-in Google Search tool used by the critic agent for claim verification
  outputs: []

scenarios:
  native:
    description: >
      GCP-native deployment: containerised ADK agent on Cloud Run with
      Vertex AI Gemini as the backing LLM and built-in Google Search for
      fact verification.
    topology:
      components:
        - name: llm-auditor-service
          role: api
          runtime:
            platform: serverless
            regions:
              - us-central1
            image:
              repository: llm-auditor
              tag: latest
            env:
              - name: GOOGLE_GENAI_USE_VERTEXAI
                value: "true"
            envFromSecretRefs:
              - google-cloud-project
              - google-cloud-location
            resources:
              cpu: "1"
              memory: 2Gi
            autoscaling:
              minReplicas: 1
              maxReplicas: 5
              policy:
                metric: cpu
                target: 70
          endpoints:
            - name: http
              port: 8080
              exposure: public
              protocol: http
              path: /

    slos:
      latency:
        p50_ms: 20000      # observed p50 ~16s + headroom
        p95_ms: 90000      # observed p95 ~83s + headroom
        p99_ms: 120000
      ttft:
        p95_ms: null       # non-streaming /run -> TTFT not measured
      reliability:
        success_rate_min_pct: 90.0   # observed ~98%, target with margin
        error_rate_max_pct: 10.0     # observed ~2%
        retry_rate_max_pct: 10.0
      cost:
        max_cost_per_transaction_usd: 0.10   # observed ~$0.054/txn + headroom
      cache:
        hit_rate_min_pct: 0.0        # agent does not use prompt caching
      load:
        replay_concurrency: 6   # light agent; handles 6 concurrent fine

    models:
      - model: gemini-2.5-flash      # optional identity
        minReplicaCount: 1           # optional, integer >= 0
        maxReplicaCount: 5           # optional, integer >= 1
      - model: gemini-2.5-pro
        minReplicaCount: 0
        maxReplicaCount: 2
    deployments:
      - name: llm-auditor-gcp-us-central
        target:
          provider: gcp
          region: us-central1
          tdfRef: llm-auditor-gcp-us-central
        components:
          - llm-auditor-service

  alternates:
    - name: local-dev
      description: >
        Local development using Gemini API key (no Vertex AI). Runs via
        uv/ADK CLI on the developer machine.
      topology:
        components:
          - name: llm-auditor-service
            role: api
            runtime:
              platform: custom
              regions:
                - local
              image:
                repository: llm-auditor
                tag: dev
              env:
                - name: GOOGLE_GENAI_USE_VERTEXAI
                  value: "false"
              envFromSecretRefs:
                - google-api-key
              resources:
                cpu: "1"
                memory: 1Gi
              autoscaling:
                minReplicas: 1
                maxReplicas: 1
            endpoints:
              - name: http
                port: 8080
                exposure: public
                protocol: http
                path: /

      slos:
        latency:
          p50_ms: 20000      # observed p50 ~16s + headroom
          p95_ms: 90000      # observed p95 ~83s + headroom
          p99_ms: 120000
        ttft:
          p95_ms: null       # non-streaming /run -> TTFT not measured
        reliability:
          success_rate_min_pct: 90.0   # observed ~98%, target with margin
          error_rate_max_pct: 10.0     # observed ~2%
          retry_rate_max_pct: 10.0
        cost:
          max_cost_per_transaction_usd: 0.10   # observed ~$0.054/txn + headroom
        cache:
          hit_rate_min_pct: 0.0        # agent does not use prompt caching
        load:
          replay_concurrency: 6   # light agent; handles 6 concurrent fine

      models:
        - model: gemini-2.5-flash      # optional identity
          minReplicaCount: 1           # optional, integer >= 0
          maxReplicaCount: 5           # optional, integer >= 1
        - model: gemini-2.5-pro
          minReplicaCount: 0
          maxReplicaCount: 2
      deployments:
        - name: local
          target:
            provider: onprem
            region: local
          components:
            - llm-auditor-service

