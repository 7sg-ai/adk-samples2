[project]
name = "blogger-agent"
version = "0.1.0"
description = "AI-driven agent designed to facilitate the exploration of the blogger agent landscape"
authors = [{ name = "Pier Paolo Ippolito", email = "pierippolito@google.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.161.0",
    "google-genai>=2.12.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "google-adk>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "google-adk[eval]>=2.5.0",
    "nest-asyncio>=1.6.0",
    "agent-starter-pack>=0.41.3",
]
deployment = [
    "absl-py~=2.5.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.15.22",
    "mypy~=2.3.0",
    "codespell~=2.4.3",
    "types-pyyaml~=6.0.12.20260518",
    "types-requests~=2.33.0.20260712",
]

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["blogger_agent"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]
exclude = [".venv"]

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.agent-starter-pack]
example_question = "Write an article about Nano Banana"

[tool.agent-starter-pack.settings]
agent_directory = "blogger_agent"
deployment_targets = ["agent_engine", "cloud_run"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"