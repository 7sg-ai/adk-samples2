apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: data-science
  description: >
    Multi-agent data-science application built with Google ADK. A top-level
    agent orchestrates database and analytics work across BigQuery and Spanner
    Graph. A user uploads an Excel workbook; the database sub-agent profiles
    its sheets and loads them as a Spanner property graph. The model is Gemini
    2.5 Flash with per-sub-agent model overrides via environment. Exposes an
    ADK web UI on port 8080.
  tags:
    env: dev
  labels:
    app: data-science
    framework: google-adk
  annotations:
    sherpa.7sg.ai/origin: adk-samples2
  version: "0.2.2"

workload:
  source:
    git:
      repoUrl: https://github.com/7sg-ai/adk-samples2
      ref: main
      path: python/agents/data-science

security:
  policies:
    secretsInEnvAllowed: true

secrets:
  provider: external-secrets
  vaults:
    - name: gcp-main
      projectIdRef: gcp-secret-manager-project-id
      tokenRef: gcp-sa-key-json
  secretRefs:
    - name: google-cloud-project
      injectAs: env
      envVar: GOOGLE_CLOUD_PROJECT
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-cloud-project
    - name: google-cloud-location
      injectAs: env
      envVar: GOOGLE_CLOUD_LOCATION
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-cloud-location
    - name: google-api-key
      injectAs: env
      envVar: GOOGLE_API_KEY
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: google-api-key
    - name: deploy-service-account-key
      injectAs: file
      filePath: /credentials/deploy-sa.json
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: deploy-service-account-key
    - name: bq-data-project-id
      injectAs: env
      envVar: BQ_DATA_PROJECT_ID
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: bq-data-project-id
    - name: alloydb-postgres-user
      injectAs: env
      envVar: ALLOYDB_POSTGRES_USER
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: alloydb-postgres-user
    - name: alloydb-postgres-password
      injectAs: env
      envVar: ALLOYDB_POSTGRES_PASSWORD
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: alloydb-postgres-password
    - name: bq-compute-project-id
      injectAs: env
      envVar: BQ_COMPUTE_PROJECT_ID
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: bq-compute-project-id
    - name: bq-dataset-id
      injectAs: env
      envVar: BQ_DATASET_ID
      source_type: literal_non_secret
      value: cymbal_flights_dataset
    - name: mcp-toolbox-host
      injectAs: env
      envVar: MCP_TOOLBOX_HOST
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: mcp-toolbox-host
    - name: mcp-toolbox-port
      injectAs: env
      envVar: MCP_TOOLBOX_PORT
      source_type: literal_non_secret
      value: "8080"
    - name: ntt-model-endpoint
      injectAs: env
      envVar: NTT_MODEL_ENDPOINT
      externalRef:
        provider: ntt-vault
        key: ntt-model-endpoint
    - name: ntt-model-api-key
      injectAs: env
      envVar: NTT_MODEL_API_KEY
      externalRef:
        provider: ntt-vault
        key: ntt-model-api-key
    - name: yugabyte-ntt-user
      injectAs: env
      envVar: YUGABYTE_USER
      externalRef:
        provider: ntt-vault
        key: yugabyte-ntt-user
    - name: yugabyte-ntt-password
      injectAs: env
      envVar: YUGABYTE_PASSWORD
      externalRef:
        provider: ntt-vault
        key: yugabyte-ntt-password
    - name: postgres-acme-password
      injectAs: env
      envVar: POSTGRES_PASSWORD
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: postgres-acme-password
    - name: neo4j-password
      injectAs: env
      envVar: NEO4J_PASSWORD
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: neo4j-password

dataSources:
  inputs:
    - name: bigquery-flights
      description: >
        BigQuery warehouse for the flights dataset. Used by the BigQuery
        sub-agent for analytical queries and cross-dataset joins.
      dsdfRef: bigquery-flights
    - name: spanner-graph
      description: >
        Spanner Graph store for uploaded Excel workbooks. The database
        sub-agent loads workbook tables and property graphs, then answers
        read-only graph questions against them.
      dsdfRef: spanner-graph-gcp
    - name: bigquery-workbook
      description: >
        BigQuery dataset workbook_data. Holds the Acme workbook tables the
        agent queries. The dataset stays in GCP.
      dsdfRef: bigquery-workbook
    - name: postgres-acme
      description: >
        In-cluster Postgres in ntt-tenant-a. A deploy Job loads
        sample_data/Acme Corp Financial Model.xlsx into this database.
      dsdfRef: postgres-acme
    - name: neo4j-graph-ntt
      description: >
        In-cluster Neo4j in ntt-tenant-a, standing in for Spanner Graph.
        Declared for the private-ntt scenario. The app does not select it
        until it accepts dataset type neo4j.
      dsdfRef: neo4j-graph-ntt
  outputs: []

scenarios:
  native:
    description: >
      GCP-native deployment. The application runs on Cloud Run. The model is
      served on Vertex AI (Gemini 2.5 Flash for the root agent; sub-agents
      inherit or override via environment). BigQuery provides warehouse
      analytics and Spanner Graph stores uploaded workbooks. No response-time
      target on this scenario.
    topology:
      components:
        - name: data-science
          role: api
          runtime:
            platform: serverless
            regions:
              - us-central1
            image:
              repository: data-science
              tag: latest
            env:
              - name: GOOGLE_GENAI_USE_VERTEXAI
                value: "true"
              - name: ROOT_AGENT_MODEL
                value: "gemini-2.5-flash"
              - name: ANALYTICS_AGENT_MODEL
                value: "gemini-2.5-flash"
              - name: DATABASE_AGENT_MODEL
                value: "gemini-2.5-flash"
              - name: SERVE_WEB_INTERFACE
                value: "true"
              - name: BQ_DATASET_ID
                value: "cymbal_flights_dataset"
              - name: SPANNER_PROJECT_ID
                value: "gen-lang-client-0373235205"
              - name: SPANNER_INSTANCE_ID
                value: "data-science"
              - name: SPANNER_DATABASE_ID
                value: "workbook_graph"
              - name: DATASET_CONFIG_FILE
                value: "/app/flights_dataset_config.json"
            envFromSecretRefs:
              - google-cloud-project
              - google-cloud-location
              - bq-data-project-id
              - bq-compute-project-id
            resources:
              cpu: "2"
              memory: 2Gi
            autoscaling:
              minReplicas: 1
              maxReplicas: 5
              policy:
                metric: cpu
                target: 70
          endpoints:
            - name: http
              port: 8080
              exposure: public
              protocol: http
              path: /
    deployments:
      - name: data-science-gcp-native
        target:
          provider: gcp
          region: us-central1
          tdfRef: gcp-native
        components:
          - data-science
        dataSources:
          - bigquery-flights
          - spanner-graph-gcp

  alternates:
    - name: private-ntt
      description: >
        App, Postgres, and Neo4j run in ntt-tenant-a on the NTT prep cluster.
        The model stays Gemini 2.5 Flash on Vertex. BigQuery workbook_data
        stays in GCP. A Job loads the Acme workbook from sample_data into
        Postgres. Neo4j is deployed in the namespace and is not selected by
        the dataset config yet.
      topology:
        components:
          - name: data-science
            role: api
            runtime:
              platform: kubernetes
              namespace: ntt-tenant-a
              image:
                repository: data-science
                tag: latest
              env:
                - name: GOOGLE_GENAI_USE_VERTEXAI
                  value: "true"
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /credentials/deploy-sa.json
                - name: ROOT_AGENT_MODEL
                  value: gemini-2.5-flash
                - name: ANALYTICS_AGENT_MODEL
                  value: gemini-2.5-flash
                - name: DATABASE_AGENT_MODEL
                  value: gemini-2.5-flash
                - name: SERVE_WEB_INTERFACE
                  value: "true"
                - name: BQ_DATASET_ID
                  value: workbook_data
                - name: DATASET_CONFIG_FILE
                  value: /app/flights_dataset_config.json
                - name: POSTGRES_HOST
                  value: postgres-acme.ntt-tenant-a.svc
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: acme
                - name: POSTGRES_USER
                  value: acme
                - name: NEO4J_URI
                  value: bolt://neo4j.ntt-tenant-a.svc:7687
              envFromSecretRefs:
                - google-cloud-project
                - google-cloud-location
                - deploy-service-account-key
                - bq-data-project-id
                - bq-compute-project-id
                - postgres-acme-password
                - neo4j-password
              resources:
                cpu: "1"
                memory: 2Gi
            endpoints:
              - name: http
                port: 8080
                exposure: private
                protocol: http
                path: /
          - name: postgres-acme
            role: database
            runtime:
              platform: kubernetes
              namespace: ntt-tenant-a
              image:
                repository: postgres
                tag: "16"
              env:
                - name: POSTGRES_DB
                  value: acme
                - name: POSTGRES_USER
                  value: acme
              envFromSecretRefs:
                - postgres-acme-password
              resources:
                cpu: "500m"
                memory: 1Gi
              persistence:
                storageClass: longhorn
                size: 20Gi
          - name: neo4j
            role: database
            runtime:
              platform: kubernetes
              namespace: ntt-tenant-a
              image:
                repository: neo4j
                tag: "5"
              envFromSecretRefs:
                - neo4j-password
              resources:
                cpu: "1"
                memory: 2Gi
              persistence:
                storageClass: longhorn
                size: 20Gi
      deployments:
        - name: data-science-private-ntt
          target:
            provider: kubernetes
            region: ntt-lab
            tdfRef: ntt-private
          components:
            - data-science
            - postgres-acme
            - neo4j
          dataSources:
            - bigquery-workbook
            - postgres-acme
            - neo4j-graph-ntt
          sla:
            targetMs: 5000
            profile: per-step
